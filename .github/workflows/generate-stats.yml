name: Generate GitHub Stats SVGs
on:
  schedule:
    - cron: "0 0 * * *" # Runs once a day at midnight UTC
  workflow_dispatch: # Lets you trigger it manually from the Actions tab
jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate stats card (dark)
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=MohamedEmad300&theme=dark&hide_border=true&include_all_commits=true'
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate stats card (light)
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=MohamedEmad300&theme=default&hide_border=true&include_all_commits=true'
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card (dark)
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=MohamedEmad300&theme=dark&hide_border=true&layout=compact'
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card (light)
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=MohamedEmad300&theme=default&hide_border=true&layout=compact'
          path: profile/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN }}

      # -f = fail (and keep the previous good file) on a non-2xx response instead of
      # saving the error page as if it were the SVG; --retry = ride out brief blips.
      # continue-on-error so a flaky/paused instance doesn't block the rest of the job.
      - name: Download streak stats (dark)
        continue-on-error: true
        run: curl -fsS --retry 3 --retry-delay 5 "https://streak-stats.demolab.com/?user=MohamedEmad300&theme=dark&hide_border=true" -o profile/streak-dark.svg

      - name: Download streak stats (light)
        continue-on-error: true
        run: curl -fsS --retry 3 --retry-delay 5 "https://streak-stats.demolab.com/?user=MohamedEmad300&theme=default&hide_border=true" -o profile/streak-light.svg

      # Some renderers exit 0 even when they fail internally and instead embed an
      # "Something went wrong" error card as the SVG output. Catch that here so a
      # broken card never gets silently committed.
      - name: Verify SVGs aren't error cards
        run: |
          for f in profile/stats-dark.svg profile/stats-light.svg profile/top-langs-dark.svg profile/top-langs-light.svg; do
            if [ -f "$f" ] && grep -q "Something went wrong" "$f"; then
              echo "::error::$f contains an error card, not a real stats SVG"
              exit 1
            fi
          done

      # Needs a PAT with read:user + public_repo scopes — GITHUB_TOKEN doesn't have
      # the right scope for the GraphQL user-info call this action makes, so it
      # reuses STATS_TOKEN.
      - name: Generate trophies (dark)
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: MohamedEmad300
          theme: radical
          file: profile/trophies-dark.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate trophies (light)
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: MohamedEmad300
          theme: flat
          file: profile/trophies-light.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update stats SVGs"
          git push
