name: Generate GitHub Stats SVGs
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate stats card (dark)
        uses: soulteary/github-readme-stats-action@main
        with:
          card: stats
          username: MohamedEmad300
          options: theme=dark&hide_border=true&include_all_commits=true&count_private=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card (light)
        uses: soulteary/github-readme-stats-action@main
        with:
          card: stats
          username: MohamedEmad300
          options: theme=default&hide_border=true&include_all_commits=true&count_private=true
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (dark)
        uses: soulteary/github-readme-stats-action@main
        with:
          card: top-langs
          username: MohamedEmad300
          options: theme=dark&hide_border=true&layout=compact
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (light)
        uses: soulteary/github-readme-stats-action@main
        with:
          card: top-langs
          username: MohamedEmad300
          options: theme=default&hide_border=true&layout=compact
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Streak stats has no equivalent "run locally" action — keep the curl
      # approach for this one, but don't let it fail the whole job
      - name: Download streak stats (dark)
        continue-on-error: true
        run: curl -fsS --retry 3 --retry-delay 5 "https://streak-stats.demolab.com/?user=MohamedEmad300&theme=dark&hide_border=true" -o profile/streak-dark.svg

      - name: Download streak stats (light)
        continue-on-error: true
        run: curl -fsS --retry 3 --retry-delay 5 "https://streak-stats.demolab.com/?user=MohamedEmad300&theme=default&hide_border=true" -o profile/streak-light.svg

      - name: Generate trophies (dark)
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: MohamedEmad300
          theme: radical
          output_path: profile/trophies-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophies (light)
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: MohamedEmad300
          theme: flat
          output_path: profile/trophies-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update stats SVGs"
          git push
