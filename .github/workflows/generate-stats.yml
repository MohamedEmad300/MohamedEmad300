name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *" # Runs once a day at midnight UTC
  workflow_dispatch: # Lets you trigger it manually from the Actions tab

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Download stats card (dark)
        run: curl -s "https://github-readme-stats.vercel.app/api?username=MohamedEmad300&theme=dark&hide_border=true&include_all_commits=true&count_private=true" -o profile/stats-dark.svg

      - name: Download stats card (light)
        run: curl -s "https://github-readme-stats.vercel.app/api?username=MohamedEmad300&theme=default&hide_border=true&include_all_commits=true&count_private=true" -o profile/stats-light.svg

      - name: Download top languages card (dark)
        run: curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=MohamedEmad300&theme=dark&hide_border=true&layout=compact" -o profile/top-langs-dark.svg

      - name: Download top languages card (light)
        run: curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=MohamedEmad300&theme=default&hide_border=true&layout=compact" -o profile/top-langs-light.svg

      - name: Download streak stats (dark)
        run: curl -s "https://streak-stats.demolab.com/?user=MohamedEmad300&theme=dark&hide_border=true" -o profile/streak-dark.svg

      - name: Download streak stats (light)
        run: curl -s "https://streak-stats.demolab.com/?user=MohamedEmad300&theme=default&hide_border=true" -o profile/streak-light.svg

      - name: Download trophies (dark)
        run: curl -s "https://github-profile-trophy.vercel.app/?username=MohamedEmad300&theme=radical&no-frame=false&no-bg=true&margin-w=4" -o profile/trophies-dark.svg

      - name: Download trophies (light)
        run: curl -s "https://github-profile-trophy.vercel.app/?username=MohamedEmad300&theme=flat&no-frame=false&no-bg=true&margin-w=4" -o profile/trophies-light.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update stats SVGs"
          git push
